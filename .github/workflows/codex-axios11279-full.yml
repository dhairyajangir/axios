# REVIEW ONLY: not published or executed. Fork-only evidence; never include in the PR.
name: Axios 11279 actual project suites (fork only)
on:
  push:
    branches: [validation/axios11279-full-20261112]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'dhairyajangir/axios' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FOCUSED_TEST_PATTERN: 'should preserve visitor helpers during nested serialization'
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - name: Verify and materialize reviewed candidate
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          BASE=4ee8d46fc463770b8f5da718d5449a5b027b2c08
          BASE_TREE=d399225a2726df161757a1028d07df6686d7bd55
          CANDIDATE_TREE=172bb13b7ed9eb2c3a9600592678dba4736452d2
          NODE_VERSION=$(node --version)
          CHECKED_OUT_HEAD=$(git rev-parse HEAD)
          CHECKED_OUT_PARENTS=$(git rev-list --parents -n 1 HEAD)
          CHECKED_OUT_BASE_TREE=$(git rev-parse "$BASE^{tree}")
          test "$NODE_VERSION" = v26.10.0
          test "$CHECKED_OUT_HEAD" = "$GITHUB_SHA"
          test "$CHECKED_OUT_PARENTS" = "$GITHUB_SHA $BASE"
          test "$CHECKED_OUT_BASE_TREE" = "$BASE_TREE"
          git diff-tree --no-commit-id --name-status -r HEAD > "$RUNNER_TEMP/added.actual"
          printf 'A\t.github/codex-axios11279-full.patch\nA\t.github/workflows/codex-axios11279-full.yml\n' > "$RUNNER_TEMP/added.expected"
          diff -u "$RUNNER_TEMP/added.expected" "$RUNNER_TEMP/added.actual"
          printf '%s  %s\n' 795058557a31656ab405f2d7c48739f3bb5f7e03257a9121bfa61af42e2a3c6f .github/codex-axios11279-full.patch | sha256sum -c -
          cp .github/codex-axios11279-full.patch "$RUNNER_TEMP/axios11279-full.patch"
          git checkout --detach "$BASE"
          git status --porcelain > "$RUNNER_TEMP/axios11279-git-status"
          test ! -s "$RUNNER_TEMP/axios11279-git-status"
          git apply --check "$RUNNER_TEMP/axios11279-full.patch"
          git apply --index "$RUNNER_TEMP/axios11279-full.patch"
          WRITTEN_TREE=$(git write-tree)
          test "$WRITTEN_TREE" = "$CANDIDATE_TREE"
          printf '%s\n' PRE_RELEASE_CHANGELOG.md lib/helpers/toFormData.js tests/unit/toFormData.test.js > "$RUNNER_TEMP/changed.expected"
          git diff --cached --name-only > "$RUNNER_TEMP/changed.actual"
          diff -u "$RUNNER_TEMP/changed.expected" "$RUNNER_TEMP/changed.actual"
          git diff --quiet
          git ls-files --others --exclude-standard > "$RUNNER_TEMP/axios11279-untracked"
          test ! -s "$RUNNER_TEMP/axios11279-untracked"
          for tree in "$BASE_TREE" "$CANDIDATE_TREE"; do
            git ls-tree -r "$tree" > "$RUNNER_TEMP/axios11279-tree-listing"
            awk '$1 == "120000" || $1 == "160000" { print "Unexpected symlink or submodule in source tree" > "/dev/stderr"; exit 1 }' "$RUNNER_TEMP/axios11279-tree-listing"
          done
          NPMRC_CONTENT=$(cat .npmrc)
          test "$NPMRC_CONTENT" = 'ignore-scripts=true'
          NPM_PREFIX=$(npm prefix)
          WORKSPACE_DIR=$(pwd -P)
          test "$NPM_PREFIX" = "$WORKSPACE_DIR"
          node --version
          npm --version
      - name: Install dependencies without lifecycle scripts
        id: install_deps
        shell: bash
        run: |
          set -euo pipefail
          NPM_PREFIX=$(npm prefix)
          WORKSPACE_DIR=$(pwd -P)
          test "$NPM_PREFIX" = "$WORKSPACE_DIR"
          NPM_REGISTRY=$(npm config get registry)
          test "$NPM_REGISTRY" = 'https://registry.npmjs.org/'
          npm ci --ignore-scripts
      - name: Lint
        id: lint
        run: npm run lint
      - name: Build project
        id: build
        run: npm run build
      - name: Install Playwright browsers and Linux dependencies
        id: browser_setup
        shell: bash
        run: |
          set -euo pipefail
          NPM_PREFIX=$(npm prefix)
          WORKSPACE_DIR=$(pwd -P)
          test "$NPM_PREFIX" = "$WORKSPACE_DIR"
          test -x node_modules/.bin/playwright
          npx playwright install --with-deps
      - name: Run all unit tests
        id: unit
        run: npm run test:vitest:unit
      - name: Run candidate regression cases
        id: green
        shell: bash
        run: |
          set -euo pipefail
          npm run test:vitest:unit -- tests/unit/toFormData.test.js -t "$FOCUSED_TEST_PATTERN" 2>&1 | tee "$RUNNER_TEMP/axios11279-candidate-green.log"
          python3 - "$RUNNER_TEMP/axios11279-candidate-green.log" <<'PYTEST'
          import pathlib, re, sys
          s = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', pathlib.Path(sys.argv[1]).read_text(errors='replace'))
          if not re.search(r'Tests\s+2 passed(?:\s|\||$)', s):
              raise SystemExit('Expected exactly two candidate regression passes')
          PYTEST
      - name: Verify regression cases fail on unchanged base
        id: red
        shell: bash
        run: |
          set -euo pipefail
          BASE_TREE=d399225a2726df161757a1028d07df6686d7bd55
          BASE_DIR="$RUNNER_TEMP/axios11279-full-base"
          mkdir "$BASE_DIR"
          git archive "$BASE_TREE" | tar -xf - -C "$BASE_DIR"
          cp tests/unit/toFormData.test.js "$BASE_DIR/tests/unit/toFormData.test.js"
          BASE_SOURCE_BLOB=$(git hash-object "$BASE_DIR/lib/helpers/toFormData.js")
          EXPECTED_SOURCE_BLOB=$(git rev-parse "$BASE_TREE:lib/helpers/toFormData.js")
          COPIED_TEST_BLOB=$(git hash-object "$BASE_DIR/tests/unit/toFormData.test.js")
          EXPECTED_TEST_BLOB=$(git rev-parse :tests/unit/toFormData.test.js)
          test "$BASE_SOURCE_BLOB" = "$EXPECTED_SOURCE_BLOB"
          test "$COPIED_TEST_BLOB" = "$EXPECTED_TEST_BLOB"
          cmp package.json "$BASE_DIR/package.json"
          cmp package-lock.json "$BASE_DIR/package-lock.json"
          cmp vitest.config.js "$BASE_DIR/vitest.config.js"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE_DIR/node_modules"
          BASE_NPM_PREFIX=$(cd "$BASE_DIR" && npm prefix)
          test "$BASE_NPM_PREFIX" = "$BASE_DIR"
          set +e
          (cd "$BASE_DIR" && npm run test:vitest:unit -- tests/unit/toFormData.test.js -t "$FOCUSED_TEST_PATTERN") 2>&1 | tee "$RUNNER_TEMP/axios11279-base-red.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[0]}" -eq 1
          test "${statuses[1]}" -eq 0
          python3 - "$RUNNER_TEMP/axios11279-base-red.log" <<'PYTEST'
          import pathlib, re, sys
          s = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', pathlib.Path(sys.argv[1]).read_text(errors='replace'))
          if not re.search(r'Tests\s+2 failed(?:\s|\||$)', s):
              raise SystemExit('Expected exactly two baseline test failures')
          for name in ['should preserve visitor helpers during nested serialization (true)', 'should preserve visitor helpers during nested serialization (null)']:
              if name not in s:
                  raise SystemExit(f'Missing expected case: {name}')
          if 'AssertionError' not in s:
              raise SystemExit('Expected error types not reported; inspect actual failure traces')
          PYTEST
          echo 'Both baseline regression cases failed; independently inspect each failure trace.'
      - name: Run all headless browser tests
        id: browser
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' && steps.install_deps.outcome == 'success' && steps.lint.outcome == 'success' && steps.build.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          WRITTEN_TREE=$(git write-tree)
          test "$WRITTEN_TREE" = 172bb13b7ed9eb2c3a9600592678dba4736452d2
          git diff --quiet
          git ls-files --others --exclude-standard > "$RUNNER_TEMP/axios11279-untracked"
          test ! -s "$RUNNER_TEMP/axios11279-untracked"
          npm run test:vitest:browser:headless
      - name: Confirm reviewed source remains unchanged
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          WRITTEN_TREE=$(git write-tree)
          test "$WRITTEN_TREE" = 172bb13b7ed9eb2c3a9600592678dba4736452d2
          git diff --quiet
          git ls-files --others --exclude-standard > "$RUNNER_TEMP/axios11279-untracked"
          test ! -s "$RUNNER_TEMP/axios11279-untracked"
